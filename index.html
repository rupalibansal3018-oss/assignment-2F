
<!DOCTYPE html>
<html>
<head>
    <title>CSS Positioning</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>CSS Positioning</h1>
    <p>Example of Relative, Absolute and Fixed Position</p>

    <h2>1. Relative Position</h2>

    <div class="relative">
        Relative Box
    </div>

    <h2>2. Absolute Position</h2>

    <div class="container">
        <div class="absolute">
            Absolute Box
        </div>
    </div>

    <h2>3. Fixed Position</h2>

    <p>Scroll the page to see the notification button.</p>

    <div class="space">
        <h3>Welcome to My Webpage!</h3>
        <p>This page demonstrates CSS positioning.</p>
    </div>

    <button class="fixed">
        Notification
    </button>

</body>
</html>
